<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, initial-scale=1.0">
    <title>合成大幸福</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>合成大幸福</h1>
    <div id="rules">
    <p>玩法说明：</p>
    <ul>
        <li>点击屏幕任意位置开始</li>
        <li>点击哪里，水果就从上方对应的横坐标掉落</li>
        <li>合成更高级水果，获得祝福语</li>
        <li>水果碰到顶部红线，游戏失败</li>
    </ul>
</div>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="message"></div>
    </div>
    <audio id="bgm" src="bgm.mp3" loop autoplay></audio>
    <audio id="merge-sound" src="merge.mp3"></audio>
    <script src="main.js"></script>
</body>
</html>
